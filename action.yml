name: Frog Contribution Graph
description: Render your GitHub contribution graph as an animated Bengali pond - a frog hops your commits.
author: Ashik
branding:
  icon: activity
  color: green
inputs:
  github_user_name:
    description: 'GitHub username whose contributions become the pond'
    required: true
  github_token:
    description: 'Token for the GitHub GraphQL API. Defaults to the runner token.'
    required: false
    default: ${{ github.token }}
  output_dir:
    description: 'Directory pond-day.svg and pond-night.svg are written to'
    required: false
    default: 'dist'
runs:
  using: 'node24'
  main: 'src/generate.mjs'
